services:
  # qBittorrent - MIGRATED TO SYNOLOGY RS2821RP+ (10.0.1.203:8080)
  # Moved for better performance - eliminates NFS write overhead
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: qbittorrent
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - WEBUI_PORT=${QBITTORRENT_PORT}
  #   volumes:
  #     - ${CONFIG_PATH}/qbittorrent:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   ports:
  #     - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
  #     - "${QBITTORRENT_CONNECTION_PORT}:${QBITTORRENT_CONNECTION_PORT}"
  #     - "${QBITTORRENT_CONNECTION_PORT}:${QBITTORRENT_CONNECTION_PORT}/udp"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Cross-seed - Automated Cross-Seeding (disabled for now)
  # cross-seed:
  #   image: ghcr.io/cross-seed/cross-seed:latest
  #   container_name: cross-seed
  #   user: ${PUID}:${PGID}
  #   volumes:
  #     - ${CONFIG_PATH}/cross-seed:/config
  #     - ${DOWNLOADS_PATH}:/downloads:ro
  #     - ${CONFIG_PATH}/qbittorrent/qBittorrent/BT_backup:/torrents:ro
  #   ports:
  #     - "${CROSS_SEED_PORT}:2468"
  #   command: daemon
  #   restart: unless-stopped
  #   networks:
  #     - mother_network
  
  # qbit_manage - MIGRATED TO SYNOLOGY RS2821RP+ (10.0.1.203)
  # Moved to run locally with qBittorrent for proper hardlink detection
  # See: synology-qbittorrent/docker-compose.yml
  # qbitmanage:
  #   image: ghcr.io/stuffanthings/qbit_manage:latest
  #   container_name: qbitmanage
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - QBT_CONFIG_DIR=/config
  #     - QBT_LOGFILE=/config/logs/qbit_manage.log
  #     - QBT_SCHEDULE=30         # run every 30 minutes
  #     - QBT_STARTUP_DELAY=60    # wait for qBittorrent to come up
  #     - QBT_RUN=false           # use internal scheduler
  #     - QBT_WEB_SERVER=false
  #     - QBT_SHARE_LIMITS=true
  #     - QBT_TAG_NOHARDLINKS=true
  #     - QBT_REM_UNREGISTERED=true
  #     - QBT_REM_ORPHANED=false  # disabled - requires BT_backup access
  #     - QBT_TAG_TRACKER_ERROR=true
  #     - QBITMANAGE_QBT_HOST=${QBITMANAGE_QBT_HOST:-http://10.0.1.203:8080}
  #     - QBITMANAGE_QBT_USER=${QBITMANAGE_QBT_USER}
  #     - QBITMANAGE_QBT_PASS=${QBITMANAGE_QBT_PASS}
  #   volumes:
  #     - ${CONFIG_PATH}/qbitmanage:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Dockhand - Docker Management 
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    environment:
      - PUID=${PUID}
      - PGID=${DOCKER_GID}
      - TZ=${TZ}
      
    group_add:
      - "${DOCKER_GID}"       
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_PATH}/dockhand:/app/data
    networks:
      - mother_network      
      

  # Radarr HD - 1080p Movie Management
  radarr-hd:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-hd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr-hd:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${RADARR_HD_PORT}:7878"
    restart: unless-stopped
    networks:
      - mother_network

  # Radarr 4K - 4K Movie Management
  radarr-4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-4k
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr-4k:/config
      - ${MOVIES_4K_PATH}:/movies-4k
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${RADARR_4K_PORT}:7878"
    restart: unless-stopped
    networks:
      - mother_network

  # Sonarr HD - 1080p TV Show Management
  sonarr-hd:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-hd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr-hd:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${SONARR_HD_PORT}:8989"
    restart: unless-stopped
    networks:
      - mother_network

  # Sonarr 4K - 4K TV Show Management
  sonarr-4k:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-4k
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr-4k:/config
      - ${TV_4K_PATH}:/tv-4k
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${SONARR_4K_PORT}:8989"
    restart: unless-stopped
    networks:
      - mother_network

  # Huntarr - Automated Quality Upgrade Hunter
  # Triggers searches for content below quality cutoff in *arr apps
  # Conservative settings to avoid overwhelming indexers
  huntarr:
    image: ghcr.io/plexguide/huntarr:latest
    container_name: huntarr
    environment:
      - TZ=${TZ}
      # Radarr HD (1080p movies)
      - RADARR_URL=http://radarr-hd:7878
      - RADARR_API_KEY=${RADARR_HD_API_KEY}
      # Radarr 4K
      - RADARR_4K_URL=http://radarr-4k:7878
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      # Sonarr HD (1080p TV)
      - SONARR_URL=http://sonarr-hd:8989
      - SONARR_API_KEY=${SONARR_HD_API_KEY}
      # Sonarr 4K
      - SONARR_4K_URL=http://sonarr-4k:8989
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      # VERY Conservative settings - minimal batches, long intervals
      # Movies: 1 per cycle, 90 min interval (max ~16/day)
      - RADARR_HUNT_MISSING_MOVIES=1
      - RADARR_HUNT_UPGRADE_MOVIES=1
      - RADARR_SLEEP_DURATION=90
      # TV: 1 series per cycle, 90 min interval (max ~16/day)
      - SONARR_HUNT_MISSING_SHOWS=1
      - SONARR_HUNT_UPGRADE_SHOWS=1
      - SONARR_SLEEP_DURATION=90
      # Queue management - pause if queue gets too large
      - MAXIMUM_QUEUE_SIZE=10
      # API rate limiting
      - API_TIMEOUT=120
    volumes:
      - ${CONFIG_PATH}/huntarr:/config
    ports:
      - "${HUNTARR_PORT:-9705}:9705"
    restart: unless-stopped
    depends_on:
      - radarr-hd
      - radarr-4k
      - sonarr-hd
      - sonarr-4k
    networks:
      - mother_network

  #Media Requesting Docker
  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}  
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_PATH}/overseer:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - mother_network        

  # Prowlarr - Indexer Manager (Alternative to Jackett)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped
    networks:
      - mother_network

  # Jackett - Indexer Manager (Alternative to Prowlarr)
  # Uncomment if using Jackett instead of Prowlarr
  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - AUTO_UPDATE=true
  #   volumes:
  #     - ${CONFIG_PATH}/jackett:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   ports:
  #     - "${JACKETT_PORT}:9117"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # FlareSolverr - CAPTCHA Solver (needed for Jackett)
  # Uncomment if using Jackett
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
     - "${FLARESOLVERR_PORT}:8191"
    restart: unless-stopped
    networks:
      - mother_network

  # Recyclarr - TRASHGuides Profile Manager
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}      
    volumes:
      - ${CONFIG_PATH}/recyclarr:/config
    restart: unless-stopped
    networks:
      - mother_network

  # Seerr - Chris's Instance
  # Note: Ali runs his own Seerr instance on Terminus
  #seerr-chris:
  #  image: ghcr.io/seerr-team/seerr:latest
  #  container_name: seerr-chris
  #  environment:
  #    - LOG_LEVEL=info
  #    - TZ=${TZ}
  #    - PORT=5056
  #  volumes:
  #    - ${CONFIG_PATH}/seerr-chris:/app/config
  #  ports:
  #    - "${SEERR_CHRIS_PORT}:5056"
  # restart: unless-stopped
  #  networks:
  #    - mother_network

  # Nginx Proxy Manager - Reverse Proxy & SSL
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
      - "${NGINX_ADMIN_PORT}:81"
    volumes:
      - ${CONFIG_PATH}/nginx/data:/data
      - ${CONFIG_PATH}/nginx/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - mother_network

  # Authelia - Authentication & 2FA
  # Uncomment if choosing Authelia over Authentik
  # authelia:
  #   image: authelia/authelia:latest
  #   container_name: authelia
  #   environment:
  #     - TZ=${TZ}
  #   volumes:
  #     - ${CONFIG_PATH}/authelia:/config
  #   ports:
  #     - "${AUTHELIA_PORT}:9091"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Authentik - Alternative to Authelia
  # Requires PostgreSQL and Redis - more complex setup
  # See Authentik documentation for full configuration

  # Tautulli - Plex Monitoring & Statistics
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/tautulli:/config
      # Optional: Mount Plex logs for real-time log parsing
      # Requires NFS/SMB mount from Plex server (10.0.0.250)
      # - /mnt/plex/logs:/plex_logs:ro
    ports:
      - "${TAUTULLI_PORT}:8181"
    restart: unless-stopped
    networks:
      - mother_network

  # Dozzle - Docker Log Viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT}:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=status=running
    restart: unless-stopped
    networks:
      - mother_network

  # Uptime Kuma - Health Monitoring & Alerts
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ${CONFIG_PATH}/uptime-kuma:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - mother_network

  # Apprise - Centralized Notification Service
  # All containers can send notifications via: http://apprise:8000/notify/{key}
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/apprise:/config
    ports:
      - "${APPRISE_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - mother_network

  # Portainer - Docker Management Interface
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_PATH}/portainer:/data
    ports:
      - "${PORTAINER_PORT}:9000"
      - "${PORTAINER_HTTPS_PORT}:9443"
    restart: unless-stopped
    networks:
      - mother_network      

  # Tracearr - Media Server Monitoring (Plex/Jellyfin/Emby)
  # Stream tracking, library analytics, account sharing detection
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:latest
    container_name: tracearr
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=${TZ}
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:-tracearr}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=info
    ports:
      - "${TRACEARR_PORT:-3002}:3000"
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mother_network

  # Tracearr - TimescaleDB (PostgreSQL)
  tracearr-db:
    image: timescale/timescaledb-ha:pg18.1-ts2.25.0
    container_name: tracearr-db
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.max_tuples_decompressed_per_dml_transaction=0 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:-tracearr}
      - POSTGRES_DB=tracearr
    volumes:
      - tracearr_timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mother_network

  # Tracearr - Redis Cache
  tracearr-redis:
    image: redis:8-alpine
    container_name: tracearr-redis
    command: redis-server --appendonly yes
    volumes:
      - tracearr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mother_network

  # Upgraderr - Quality upgrade automation (Huntarr replacement)
  upgraderr:
    build:
      context: .
      dockerfile: services/upgraderr/Dockerfile
    container_name: upgraderr
    environment:
      - TZ=${TZ}
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7879
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8990
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - UPGRADERR_ADMIN_PASSWORD=${UPGRADERR_ADMIN_PASSWORD}
      - UPGRADERR_SECRET_KEY=${UPGRADERR_SECRET_KEY}
      - UPGRADERR_SEARCHES_PER_HOUR=${UPGRADERR_SEARCHES_PER_HOUR:-5}
      - UPGRADERR_DOWNLOADS_PER_DAY=${UPGRADERR_DOWNLOADS_PER_DAY:-10}
      - UPGRADERR_COOLDOWN_HOURS=${UPGRADERR_COOLDOWN_HOURS:-24}
      - UPGRADERR_SWEEP_MINUTES=${UPGRADERR_SWEEP_MINUTES:-30}
      - UPGRADERR_MIN_SCORE=${UPGRADERR_MIN_SCORE:-200}
      - UPGRADERR_SEASON_THRESHOLD=${UPGRADERR_SEASON_THRESHOLD:-50}
      - UPGRADERR_BLURAY_WAIT_DAYS=${UPGRADERR_BLURAY_WAIT_DAYS:-90}
      - UPGRADERR_ENABLE_TMDB=${UPGRADERR_ENABLE_TMDB:-true}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - UPGRADERR_TELEGRAM_CHAT_ID=${UPGRADERR_TELEGRAM_CHAT_ID:-}
    volumes:
      - /opt/mother/data/upgraderr:/data
      - /opt/mother/reports:/opt/sync_reports:ro
    ports:
      - "${UPGRADERR_PORT:-9706}:5000"
    restart: unless-stopped
    depends_on:
      - radarr-hd
      - radarr-4k
      - sonarr-hd
      - sonarr-4k
    networks:
      - mother_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Curatorr - Media Intelligence & Curation
  curatorr:
    build:
      context: .
      dockerfile: services/curatorr/Dockerfile
    container_name: curatorr
    ports:
      - "${CURATORR_PORT:-9707}:8000"
    environment:
      - CURATORR_SECRET_KEY=${CURATORR_SECRET_KEY:-}
      - CURATORR_ADMIN_PASSWORD=${CURATORR_ADMIN_PASSWORD:-}
      - CHRIS_PLEX_URL=http://10.0.0.250:32400
      - CHRIS_PLEX_TOKEN=_baJvspRxVjRzaokRoLB
      - ALI_PLEX_URL=${ALI_PLEX_URL}
      - ALI_PLEX_TOKEN=${ALI_PLEX_TOKEN}
      - CHRIS_TAUTULLI_URL=http://tautulli:8181
      - CHRIS_TAUTULLI_KEY=${CHRIS_TAUTULLI_API_KEY}
      - ALI_TAUTULLI_URL=${ALI_TAUTULLI_URL}
      - ALI_TAUTULLI_KEY=${ALI_TAUTULLI_API_KEY}
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7878
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8989
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CURATORR_TELEGRAM_CHAT_ID=${CURATORR_TELEGRAM_CHAT_ID}
      - UNRAID_MEDIA_PATH=/mnt/unraid/media
      - RADARR_HD_PUBLIC_URL=${RADARR_HD_PUBLIC_URL:-}
      - RADARR_4K_PUBLIC_URL=${RADARR_4K_PUBLIC_URL:-}
      - SONARR_HD_PUBLIC_URL=${SONARR_HD_PUBLIC_URL:-}
      - SONARR_4K_PUBLIC_URL=${SONARR_4K_PUBLIC_URL:-}
      - OVERSEERR_URL=${OVERSEERR_URL:-}
    volumes:
      - /opt/mother/data/curatorr:/data
      - /mnt/unraid/media:/mnt/unraid/media
    restart: unless-stopped
    networks:
      - mother_network
    depends_on:
      - radarr-hd
      - radarr-4k
      - sonarr-hd
      - sonarr-4k
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Sync Webhook - Real-time sync triggered by Radarr/Sonarr
  sync-webhook:
    build:
      context: ./services/sync-webhook
      dockerfile: Dockerfile
    container_name: sync-webhook
    environment:
      - TZ=${TZ}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SYNC_DRY_RUN=${SYNC_DRY_RUN:-false}
      - SYNC_LOG_LEVEL=${SYNC_LOG_LEVEL:-INFO}
      - SYNC_LOG_PATH=/logs
      - SYNC_DB_PATH=/data/sync_jobs.db
      # Concurrency: max simultaneous rsync operations (default: 2)
      # Can increase to 4-8 after bulk sync completes for faster ongoing sync
      - SYNC_MAX_CONCURRENT=${SYNC_MAX_CONCURRENT:-2}
      # Plex integration - triggers library scan after sync
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_SECTION_MOVIES=${PLEX_SECTION_MOVIES:-}
      - PLEX_SECTION_MOVIES_4K=${PLEX_SECTION_MOVIES_4K:-}
      - PLEX_SECTION_TV=${PLEX_SECTION_TV:-}
      - PLEX_SECTION_TV_4K=${PLEX_SECTION_TV_4K:-}
      # Radarr/Sonarr API for history scanning (catches missed webhooks)
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7878
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8989
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      # History scanner settings
      - SYNC_HISTORY_SCAN_HOURS=${SYNC_HISTORY_SCAN_HOURS:-6}
      - SYNC_HISTORY_SCAN_INTERVAL=${SYNC_HISTORY_SCAN_INTERVAL:-30}
      # Skip list for problematic large files
      - SYNC_SKIP_TITLES=${SYNC_SKIP_TITLES:-}
    volumes:
      # Synology NFS mounts (source)
      - /mnt/synology/rs-movies:/mnt/synology/rs-movies:ro
      - /mnt/synology/rs-tv:/mnt/synology/rs-tv:ro
      - /mnt/synology/rs-4kmedia:/mnt/synology/rs-4kmedia:ro
      # Unraid NFS mounts (destination)
      - /mnt/unraid/media:/mnt/unraid/media
      # Persistent logs and database
      - ${CONFIG_PATH}/sync-webhook/logs:/logs
      - ${CONFIG_PATH}/sync-webhook/data:/data
    ports:
      - "${SYNC_WEBHOOK_PORT:-5001}:5000"
    restart: unless-stopped
    networks:
      - mother_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

  # Duplicati - Docker volume and config backup client
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "${DUPLICATI_PORT:-8200}:8200"
    volumes:
      - /opt/mother/data/duplicati:/config
      - /opt/mother:/source/mother:ro
      - /opt/mother/data:/source/data:ro
    restart: unless-stopped
    networks:
      - mother_network

networks:
  mother_network:
    driver: bridge

volumes:
  tracearr_timescale_data:
  tracearr_redis_data:
