x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # qBittorrent - MIGRATED TO SYNOLOGY RS2821RP+ (10.0.1.203:8080)
  # Moved for better performance - eliminates NFS write overhead
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: qbittorrent
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - WEBUI_PORT=${QBITTORRENT_PORT}
  #   volumes:
  #     - ${CONFIG_PATH}/qbittorrent:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   ports:
  #     - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
  #     - "${QBITTORRENT_CONNECTION_PORT}:${QBITTORRENT_CONNECTION_PORT}"
  #     - "${QBITTORRENT_CONNECTION_PORT}:${QBITTORRENT_CONNECTION_PORT}/udp"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Cross-seed - Automated Cross-Seeding (disabled for now)
  # cross-seed:
  #   image: ghcr.io/cross-seed/cross-seed:latest
  #   container_name: cross-seed
  #   user: ${PUID}:${PGID}
  #   volumes:
  #     - ${CONFIG_PATH}/cross-seed:/config
  #     - ${DOWNLOADS_PATH}:/downloads:ro
  #     - ${CONFIG_PATH}/qbittorrent/qBittorrent/BT_backup:/torrents:ro
  #   ports:
  #     - "${CROSS_SEED_PORT}:2468"
  #   command: daemon
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # qbit_manage - MIGRATED TO SYNOLOGY RS2821RP+ (10.0.1.203)
  # Moved to run locally with qBittorrent for proper hardlink detection
  # See: synology-qbittorrent/docker-compose.yml
  # qbitmanage:
  #   image: ghcr.io/stuffanthings/qbit_manage:latest
  #   container_name: qbitmanage
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - QBT_CONFIG_DIR=/config
  #     - QBT_LOGFILE=/config/logs/qbit_manage.log
  #     - QBT_SCHEDULE=30         # run every 30 minutes
  #     - QBT_STARTUP_DELAY=60    # wait for qBittorrent to come up
  #     - QBT_RUN=false           # use internal scheduler
  #     - QBT_WEB_SERVER=false
  #     - QBT_SHARE_LIMITS=true
  #     - QBT_TAG_NOHARDLINKS=true
  #     - QBT_REM_UNREGISTERED=true
  #     - QBT_REM_ORPHANED=false  # disabled - requires BT_backup access
  #     - QBT_TAG_TRACKER_ERROR=true
  #     - QBITMANAGE_QBT_HOST=${QBITMANAGE_QBT_HOST:-http://10.0.1.203:8080}
  #     - QBITMANAGE_QBT_USER=${QBITMANAGE_QBT_USER}
  #     - QBITMANAGE_QBT_PASS=${QBITMANAGE_QBT_PASS}
  #   volumes:
  #     - ${CONFIG_PATH}/qbitmanage:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Dockhand - Docker Management
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    labels:
      - "autoheal=true"
    environment:
      - PUID=${PUID}
      - PGID=${DOCKER_GID}
      - TZ=${TZ}

    group_add:
      - "${DOCKER_GID}"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_PATH}/dockhand:/app/data
    networks:
      - mother_network


  # Unpackerr - Automatic RAR/archive extractor for Radarr/Sonarr
  unpackerr:
    image: golift/unpackerr:0.15.2
    container_name: unpackerr
    restart: unless-stopped
    logging: *default-logging
    user: ${PUID}:${PGID}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
    environment:
      - TZ=${TZ}
      - UN_LOG_FILE=/downloads/unpackerr.log
      - UN_INTERVAL=2m
      - UN_PARALLEL=1
      - UN_DELETE_DELAY=5m
      - UN_DELETE_ORIGINAL=true
      - UN_DELETE_FILES=true
      # Radarr HD
      - UN_RADARR_0_URL=http://radarr-hd:7878
      - UN_RADARR_0_API_KEY=${RADARR_HD_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads/radarr-hd
      - UN_RADARR_0_PROTOCOLS=torrent
      # Radarr 4K
      - UN_RADARR_1_URL=http://radarr-4k:7878
      - UN_RADARR_1_API_KEY=${RADARR_4K_API_KEY}
      - UN_RADARR_1_PATHS_0=/downloads/radarr-4k
      - UN_RADARR_1_PROTOCOLS=torrent
      # Sonarr HD
      - UN_SONARR_0_URL=http://sonarr-hd:8989
      - UN_SONARR_0_API_KEY=${SONARR_HD_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads/sonarr-hd
      - UN_SONARR_0_PROTOCOLS=torrent
      # Sonarr 4K
      - UN_SONARR_1_URL=http://sonarr-4k:8989
      - UN_SONARR_1_API_KEY=${SONARR_4K_API_KEY}
      - UN_SONARR_1_PATHS_0=/downloads/sonarr-4k
      - UN_SONARR_1_PROTOCOLS=torrent
      # Telegram notifications — errors only (EXTRACTFAILED=3, DELETEFAILED=7).
      # Was EVENTS_0=0 (all events: queued/extracting/extracted/imported/deleting/
      # deleted too) which fired on every normal extraction, not just failures.
      - UN_WEBHOOK_0_URL=https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
      - UN_WEBHOOK_0_NICKNAME=${TELEGRAM_CHAT_ID}
      - UN_WEBHOOK_0_TEMPLATE=telegram
      - UN_WEBHOOK_0_EVENTS_0=3
      - UN_WEBHOOK_0_EVENTS_1=7
    networks:
      - mother_network

  # Radarr HD - 1080p Movie Management
  radarr-hd:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-hd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr-hd:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
      - ${DELETED_MOVIES_PATH}:/deleted-movies
    ports:
      - "${RADARR_HD_PORT}:7878"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Radarr 4K - 4K Movie Management
  radarr-4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-4k
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr-4k:/config
      - ${MOVIES_4K_PATH}:/movies-4k
      - ${DOWNLOADS_PATH}:/downloads
      - ${DELETED_MOVIES_4K_PATH}:/deleted-movies-4k
    ports:
      - "${RADARR_4K_PORT}:7878"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Sonarr HD - 1080p TV Show Management
  sonarr-hd:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-hd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr-hd:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
      - ${DELETED_TV_PATH}:/deleted-tv
    ports:
      - "${SONARR_HD_PORT}:8989"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Sonarr 4K - 4K TV Show Management
  sonarr-4k:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-4k
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr-4k:/config
      - ${TV_4K_PATH}:/tv-4k
      - ${DOWNLOADS_PATH}:/downloads
      - ${DELETED_TV_4K_PATH}:/deleted-tv-4k
    ports:
      - "${SONARR_4K_PORT}:8989"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  #Media Requesting Docker
  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_PATH}/overseer:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Prowlarr - Indexer Manager (Alternative to Jackett)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Jackett - Indexer Manager (Alternative to Prowlarr)
  # Uncomment if using Jackett instead of Prowlarr
  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - AUTO_UPDATE=true
  #   volumes:
  #     - ${CONFIG_PATH}/jackett:/config
  #     - ${DOWNLOADS_PATH}:/downloads
  #   ports:
  #     - "${JACKETT_PORT}:9117"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # FlareSolverr - CAPTCHA Solver (needed for Jackett)
  # Uncomment if using Jackett
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
     - "${FLARESOLVERR_PORT}:8191"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Recyclarr - TRASHGuides Profile Manager
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
    volumes:
      - ${CONFIG_PATH}/recyclarr:/config
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Seerr - Chris's Instance
  # Note: Ali runs his own Seerr instance on Terminus
  #seerr-chris:
  #  image: ghcr.io/seerr-team/seerr:latest
  #  container_name: seerr-chris
  #  environment:
  #    - LOG_LEVEL=info
  #    - TZ=${TZ}
  #    - PORT=5056
  #  volumes:
  #    - ${CONFIG_PATH}/seerr-chris:/app/config
  #  ports:
  #    - "${SEERR_CHRIS_PORT}:5056"
  # restart: unless-stopped
  #  networks:
  #    - mother_network

  # Nginx Proxy Manager - Reverse Proxy & SSL
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
      - "${NGINX_ADMIN_PORT}:81"
    volumes:
      - ${CONFIG_PATH}/nginx/data:/data
      - ${CONFIG_PATH}/nginx/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Authelia - Authentication & 2FA
  # Uncomment if choosing Authelia over Authentik
  # authelia:
  #   image: authelia/authelia:latest
  #   container_name: authelia
  #   environment:
  #     - TZ=${TZ}
  #   volumes:
  #     - ${CONFIG_PATH}/authelia:/config
  #   ports:
  #     - "${AUTHELIA_PORT}:9091"
  #   restart: unless-stopped
  #   networks:
  #     - mother_network

  # Authentik - Alternative to Authelia
  # Requires PostgreSQL and Redis - more complex setup
  # See Authentik documentation for full configuration

  # Tautulli - Plex Monitoring & Statistics
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/tautulli:/config
      # Optional: Mount Plex logs for real-time log parsing
      # Requires NFS/SMB mount from Plex server (10.0.0.250)
      # - /mnt/plex/logs:/plex_logs:ro
    ports:
      - "${TAUTULLI_PORT}:8181"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Dozzle - Docker Log Viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT}:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=status=running
      - DOZZLE_REMOTE_AGENT=10.0.1.203:7007
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Decluttarr - Radarr/Sonarr/qBittorrent queue hygiene (stalled/failed/orphaned
  # removal). Deployed 2026-07-19 in test_run (dry-run) mode — review logs before
  # flipping general.test_run to false in configs/decluttarr/config.yaml. Deliberately
  # does NOT own search-triggering (search_unmet_cutoff/search_missing) — Upgraderr
  # already owns that decision for this stack via its 7-tier classification.
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    labels:
      - "autoheal=true"
    volumes:
      - ${CONFIG_PATH}/decluttarr:/app/config
    environment:
      - TZ=${TZ}
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - QBITMANAGE_QBT_HOST=${QBITMANAGE_QBT_HOST}
      - QBITMANAGE_QBT_USER=${QBITMANAGE_QBT_USER}
      - QBITMANAGE_QBT_PASS=${QBITMANAGE_QBT_PASS}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Uptime Kuma - Health Monitoring & Alerts
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    labels:
      - "autoheal=true"
    volumes:
      - ${CONFIG_PATH}/uptime-kuma:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Apprise - Centralized Notification Service
  # All containers can send notifications via: http://apprise:8000/notify/{key}
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/apprise:/config
    ports:
      - "${APPRISE_PORT:-8000}:8000"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Tracearr - Media Server Monitoring (Plex/Jellyfin/Emby)
  # Stream tracking, library analytics, account sharing detection
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:latest
    container_name: tracearr
    labels:
      - "autoheal=true"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=${TZ}
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:-tracearr}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=info
    ports:
      - "${TRACEARR_PORT:-3002}:3000"
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Tracearr - TimescaleDB (PostgreSQL)
  tracearr-db:
    image: timescale/timescaledb-ha:pg18.1-ts2.25.0
    container_name: tracearr-db
    labels:
      - "autoheal=true"
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.max_tuples_decompressed_per_dml_transaction=0 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:-tracearr}
      - POSTGRES_DB=tracearr
    volumes:
      - tracearr_timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Tracearr - Redis Cache
  tracearr-redis:
    image: redis:8-alpine
    container_name: tracearr-redis
    command: redis-server --appendonly yes
    volumes:
      - tracearr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

  # Upgraderr - Quality upgrade automation (Huntarr replacement)
  upgraderr:
    build:
      context: .
      dockerfile: services/upgraderr/Dockerfile
    container_name: upgraderr
    labels:
      - "autoheal=true"
    environment:
      - TZ=${TZ}
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7879
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8990
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - UPGRADERR_ADMIN_PASSWORD=${UPGRADERR_ADMIN_PASSWORD}
      - UPGRADERR_SECRET_KEY=${UPGRADERR_SECRET_KEY}
      - UPGRADERR_SEARCHES_PER_HOUR=${UPGRADERR_SEARCHES_PER_HOUR:-5}
      - UPGRADERR_DOWNLOADS_PER_DAY=${UPGRADERR_DOWNLOADS_PER_DAY:-10}
      - UPGRADERR_COOLDOWN_HOURS=${UPGRADERR_COOLDOWN_HOURS:-24}
      - UPGRADERR_SWEEP_MINUTES=${UPGRADERR_SWEEP_MINUTES:-30}
      - UPGRADERR_MIN_SCORE=${UPGRADERR_MIN_SCORE:-200}
      - UPGRADERR_SEASON_THRESHOLD=${UPGRADERR_SEASON_THRESHOLD:-50}
      # No-source handling (2026-08-01): after N failed searches, tag upgraderr-no-source
      # and drop to a rare recheck (days) instead of the 30-day churn.
      - UPGRADERR_NO_SOURCE_TAG_THRESHOLD=${UPGRADERR_NO_SOURCE_TAG_THRESHOLD:-6}
      - UPGRADERR_NO_SOURCE_RECHECK_DAYS=${UPGRADERR_NO_SOURCE_RECHECK_DAYS:-180}
      - UPGRADERR_BLURAY_WAIT_DAYS=${UPGRADERR_BLURAY_WAIT_DAYS:-90}
      - UPGRADERR_ENABLE_TMDB=${UPGRADERR_ENABLE_TMDB:-true}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - UPGRADERR_TELEGRAM_CHAT_ID=${UPGRADERR_TELEGRAM_CHAT_ID:-}
      - QBITTORRENT_URL=${QBITTORRENT_URL:-http://10.0.1.203:8080}
      - QBITTORRENT_USER=${QBITMANAGE_QBT_USER:-}
      - QBITTORRENT_PASS=${QBITMANAGE_QBT_PASS:-}
    volumes:
      - /opt/mother/data/upgraderr:/data
      - /opt/mother/data/logs/upgraderr:/logs
      - /opt/mother/reports:/opt/sync_reports:ro
      # Shared TRaSH scoring config (single source of truth across all services)
      - /opt/mother/configs/scoring/trash_scoring.json:/app/scoring/trash_scoring.json:ro
    ports:
      - "${UPGRADERR_PORT:-9706}:5000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - radarr-hd
      - radarr-4k
      - sonarr-hd
      - sonarr-4k
    networks:
      - mother_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Curatorr - Media Intelligence & Curation
  curatorr:
    build:
      context: .
      dockerfile: services/curatorr/Dockerfile
    container_name: curatorr
    labels:
      - "autoheal=true"
    ports:
      - "${CURATORR_PORT:-9707}:8000"
    environment:
      - CURATORR_SECRET_KEY=${CURATORR_SECRET_KEY:-}
      - CURATORR_ADMIN_PASSWORD=${CURATORR_ADMIN_PASSWORD:-}
      - CHRIS_PLEX_URL=http://10.0.0.250:32400
      - CHRIS_PLEX_TOKEN=_baJvspRxVjRzaokRoLB
      - ALI_PLEX_URL=${ALI_PLEX_URL}
      - ALI_PLEX_TOKEN=${ALI_PLEX_TOKEN}
      - CHRIS_TAUTULLI_URL=http://tautulli:8181
      - CHRIS_TAUTULLI_KEY=${CHRIS_TAUTULLI_API_KEY}
      - ALI_TAUTULLI_URL=${ALI_TAUTULLI_URL}
      - ALI_TAUTULLI_KEY=${ALI_TAUTULLI_API_KEY}
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7878
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8989
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - ALI_RADARR_URL=${ALI_RADARR_URL:-}
      - ALI_RADARR_API_KEY=${ALI_RADARR_API_KEY:-}
      - ALI_SONARR_URL=${ALI_SONARR_URL:-}
      - ALI_SONARR_API_KEY=${ALI_SONARR_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CURATORR_TELEGRAM_CHAT_ID=${CURATORR_TELEGRAM_CHAT_ID}
      - UNRAID_MEDIA_PATH=/mnt/unraid/media
      - RADARR_HD_PUBLIC_URL=${RADARR_HD_PUBLIC_URL:-}
      - RADARR_4K_PUBLIC_URL=${RADARR_4K_PUBLIC_URL:-}
      - SONARR_HD_PUBLIC_URL=${SONARR_HD_PUBLIC_URL:-}
      - SONARR_4K_PUBLIC_URL=${SONARR_4K_PUBLIC_URL:-}
      - OVERSEERR_URL=${OVERSEERR_URL:-}
      - OVERSEERR_API_KEY=${OVERSEERR_API_KEY:-}
      - UNRAID_AGENT_URL=${UNRAID_AGENT_URL:-http://192.168.1.10:8100}
      - UNRAID_AGENT_API_KEY=${UNRAID_AGENT_API_KEY:-}
      - ALI_PLEX_USERNAME=${ALI_PLEX_USERNAME:-}
      - CHRIS_PLEX_USERNAME=${CHRIS_PLEX_USERNAME:-}
      - TIER7_PENDING_PATH=${TIER7_PENDING_PATH:-/data/upgraderr_ro/tier7_pending.json}
    volumes:
      - /opt/mother/data/curatorr:/data
      - /opt/mother/data/logs/curatorr:/logs
      # rslave: host remount of this CIFS mount propagates into the running
      # container (host mount is `shared`), so a VPN-blip/boot-race remount no
      # longer needs a container restart. See deploy/host/ for the host-side unit.
      - /mnt/unraid/media:/mnt/unraid/media:rslave
      - /mnt/synology/rs-movies:/mnt/synology/rs-movies
      - /mnt/synology/rs-tv:/mnt/synology/rs-tv
      - /mnt/synology/rs-4kmedia:/mnt/synology/rs-4kmedia
      - /opt/mother/configs/scoring/trash_scoring.json:/app/scoring/trash_scoring.json:ro
      # Read-only cross-service access to Upgraderr's tier7_profile_mismatch queue —
      # a plain JSON export (written by Upgraderr after each sweep), not direct
      # cross-container SQLite access: a read-only bind mount can't create the -shm
      # file WAL mode needs, so cross-process SQLite reads intermittently failed with
      # "unable to open database file." Mirrors the trash_scoring.json pattern below —
      # with one difference: this file is rewritten automatically every 30 min via
      # Upgraderr's own os.replace()-based atomic swap (new inode each write), whereas
      # trash_scoring.json is only ever hand-edited (rare, always followed by a
      # documented container restart). Docker single-FILE bind mounts follow the
      # inode at mount time, not the path — confirmed live 2026-07-06: after the
      # first os.replace(), this container kept serving the original (now-stale)
      # inode's content indefinitely, silently diverging from the host file, while
      # Upgraderr's own container (which performs the write, not a bind-mount read of
      # it) saw the fresh content immediately. Mounting the containing DIRECTORY
      # instead resolves this: directory bind mounts follow the current directory
      # entry for a given filename, so a replaced inode is visible on the next read
      # without a container restart.
      - /opt/mother/data/upgraderr:/data/upgraderr_ro:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network
    depends_on:
      - radarr-hd
      - radarr-4k
      - sonarr-hd
      - sonarr-4k
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Sync Webhook - Real-time sync triggered by Radarr/Sonarr
  sync-webhook:
    build:
      context: ./services/sync-webhook
      dockerfile: Dockerfile
    container_name: sync-webhook
    environment:
      - TZ=${TZ}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Unraid dedup notifications specifically route here instead of TELEGRAM_CHAT_ID
      # (2026-07-30, Ali's request) -- same chat Curatorr's Synology dedup already uses,
      # so both dedup systems' notifications land in one place.
      - CURATORR_TELEGRAM_CHAT_ID=${CURATORR_TELEGRAM_CHAT_ID}
      - SYNC_DRY_RUN=${SYNC_DRY_RUN:-false}
      - SYNC_LOG_LEVEL=${SYNC_LOG_LEVEL:-INFO}
      - SYNC_LOG_PATH=/logs
      - SYNC_DB_PATH=/data/sync_jobs.db
      # Concurrency: max simultaneous rsync operations (default: 2)
      # Can increase to 4-8 after bulk sync completes for faster ongoing sync
      - SYNC_MAX_CONCURRENT=${SYNC_MAX_CONCURRENT:-2}
      # Plex integration - triggers library scan after sync
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_SECTION_MOVIES=${PLEX_SECTION_MOVIES:-}
      - PLEX_SECTION_MOVIES_4K=${PLEX_SECTION_MOVIES_4K:-}
      - PLEX_SECTION_TV=${PLEX_SECTION_TV:-}
      - PLEX_SECTION_TV_4K=${PLEX_SECTION_TV_4K:-}
      # Radarr/Sonarr API for history scanning (catches missed webhooks)
      - RADARR_HD_URL=http://radarr-hd:7878
      - RADARR_HD_API_KEY=${RADARR_HD_API_KEY}
      - RADARR_4K_URL=http://radarr-4k:7878
      - RADARR_4K_API_KEY=${RADARR_4K_API_KEY}
      - SONARR_HD_URL=http://sonarr-hd:8989
      - SONARR_HD_API_KEY=${SONARR_HD_API_KEY}
      - SONARR_4K_URL=http://sonarr-4k:8989
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      # History scanner settings
      - SYNC_HISTORY_SCAN_HOURS=${SYNC_HISTORY_SCAN_HOURS:-6}
      - SYNC_HISTORY_SCAN_INTERVAL=${SYNC_HISTORY_SCAN_INTERVAL:-30}
      # Skip list for problematic large files
      - SYNC_SKIP_TITLES=${SYNC_SKIP_TITLES:-}
      # Unraid Agent — for nightly gap scan (avoids slow CIFS listing)
      - UNRAID_AGENT_URL=${UNRAID_AGENT_URL:-http://192.168.1.10:8100}
      - UNRAID_AGENT_API_KEY=${UNRAID_AGENT_API_KEY:-}
      # Version reconcile caps (both directions: Syn→Unraid and Unraid→Syn)
      - VERSION_SYNC_MAX_PER_RUN=${VERSION_SYNC_MAX_PER_RUN:-500}
      - VERSION_SYNC_DRY_RUN=${VERSION_SYNC_DRY_RUN:-false}
      # Unraid dedup safety controls — these existed in .env and were documented in
      # CLAUDE.md but were never actually wired through to the container (found
      # 2026-07-02): the container always ran on the Python code's hardcoded
      # defaults (200/50/false/10/24) regardless of .env. Added so .env changes
      # actually take effect.
      - DEDUP_SAFETY_LIMIT=${DEDUP_SAFETY_LIMIT:-200}
      - DEDUP_SAFETY_LIMIT_WEEKLY=${DEDUP_SAFETY_LIMIT_WEEKLY:-500}
      - DEDUP_MAX_PER_RUN=${DEDUP_MAX_PER_RUN:-50}
      - DEDUP_DRY_RUN=${DEDUP_DRY_RUN:-false}
      - DEDUP_WARN_MINUTES=${DEDUP_WARN_MINUTES:-10}
      - DEDUP_MIN_AGE_HOURS=${DEDUP_MIN_AGE_HOURS:-24}
      - TIER7_PENDING_PATH=${TIER7_PENDING_PATH:-/data/upgraderr_ro/tier7_pending.json}
      # Stuck-state alerter (2026-08-01) — escalate the silent-failure family to Telegram
      - STUCK_DEDUP_DAYS=${STUCK_DEDUP_DAYS:-3}
      - STUCK_PENDING_HOURS=${STUCK_PENDING_HOURS:-12}
      # Tracking Reconciler (2026-08-01) — see docs/TRACKING_RECONCILER.md. Staged
      # rollout: 'flag' (report only, no writes) -> 'act' (rate-limited adoptions).
      - RECONCILE_MODE=${RECONCILE_MODE:-flag}
      - RECONCILE_MAX_ADOPTIONS_PER_RUN=${RECONCILE_MAX_ADOPTIONS_PER_RUN:-10}
    volumes:
      # Synology NFS mounts (rw: source for forward sync, destination for reverse sync)
      - /mnt/synology/rs-movies:/mnt/synology/rs-movies
      - /mnt/synology/rs-tv:/mnt/synology/rs-tv
      - /mnt/synology/rs-4kmedia:/mnt/synology/rs-4kmedia
      # Unraid CIFS mount (destination for forward sync, source for reverse sync)
      # rslave: host remount propagates in without a container restart (host
      # mount is `shared`). See deploy/host/ for the host-side ensure-mount unit.
      - /mnt/unraid/media:/mnt/unraid/media:rslave
      # Persistent logs and database
      - ${CONFIG_PATH}/sync-webhook/logs:/logs
      - ${CONFIG_PATH}/sync-webhook/data:/data
      # Shared TRaSH scoring config (single source of truth across all services)
      - /opt/mother/configs/scoring/trash_scoring.json:/app/scoring/trash_scoring.json:ro
      # Read-only cross-service access to Upgraderr's tier7_profile_mismatch queue —
      # a plain JSON export (written by Upgraderr after each sweep), not direct
      # cross-container SQLite access: a read-only bind mount can't create the -shm
      # file WAL mode needs, so cross-process SQLite reads intermittently failed with
      # "unable to open database file." Mirrors the trash_scoring.json pattern above —
      # with one difference: this file is rewritten automatically every 30 min via
      # Upgraderr's own os.replace()-based atomic swap (new inode each write), whereas
      # trash_scoring.json is only ever hand-edited (rare, always followed by a
      # documented container restart). Docker single-FILE bind mounts follow the
      # inode at mount time, not the path — confirmed live 2026-07-06: after the
      # first os.replace(), this container kept serving the original (now-stale)
      # inode's content indefinitely, silently diverging from the host file, while
      # Upgraderr's own container (which performs the write, not a bind-mount read of
      # it) saw the fresh content immediately. Mounting the containing DIRECTORY
      # instead resolves this: directory bind mounts follow the current directory
      # entry for a given filename, so a replaced inode is visible on the next read
      # without a container restart.
      - /opt/mother/data/upgraderr:/data/upgraderr_ro:ro
    ports:
      - "${SYNC_WEBHOOK_PORT:-5001}:5000"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

  # ── Observability stack ───────────────────────────────────────────────────
  # Loki: log storage | Promtail: log collector | Grafana: unified UI
  # Prometheus + Node Exporter + cAdvisor: host + container metrics
  # Grafana on :3001 (3000 taken by Dockhand)

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    labels:
      - "autoheal=true"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - /opt/mother/configs/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /opt/mother/data/loki:/loki
    networks:
      - mother_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana Alloy — log shipper (replaces Promtail 2026-08). Same Loki label
  # schema {host,service,job,compose_service}. Version pinned intentionally;
  # bump deliberately, not via :latest (see qbitmanage override incident).
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - /opt/mother/configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/mother/data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/mother/data/logs:/opt/mother/data/logs:ro
      - /opt/mother/configs/sync-webhook/logs:/opt/mother/configs/sync-webhook/logs:ro
    networks:
      - mother_network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Consumed by provisioned Telegram contact point (Mother Notifications)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - /opt/mother/data/grafana:/var/lib/grafana
      - /opt/mother/configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mother_network
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - /opt/mother/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/mother/data/prometheus:/prometheus
    networks:
      - mother_network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    network_mode: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    labels:
      - "autoheal=true"
    restart: unless-stopped
    logging: *default-logging
    command:
      # Docker uses the containerd image store (overlayfs driver), which cAdvisor
      # can't read via the docker layer layout. Point it at containerd directly
      # (Docker's containers live in the 'moby' namespace). Test 2026-08-29.
      - --containerd=/run/containerd/containerd.sock
      - --containerd-namespace=moby
      - --docker_only=true
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - mother_network

  # autoheal — self-recovery layer. Restarts any labeled container Docker marks
  # "unhealthy" (a healthcheck failing). Complements each service's
  # restart: unless-stopped policy (which already covers hard crashes/exits):
  # autoheal covers the "running but hung / failing its healthcheck" case that
  # a restart policy never catches.
  #
  # EXCLUDES sync-webhook (2026-08-29): a plain `docker restart` on it, while it
  # has in-progress rsyncs to a slow/blackholed CIFS mount, can wedge the
  # container at the containerd level (D-state I/O -> "did not receive an exit
  # event" -> unkillable, survived even a host reboot once). Its own gunicorn
  # shutdown hooks (gunicorn.conf.py) now signal those rsyncs on SIGTERM, but
  # autoheal firing a blind restart on top of an already-degraded mount is still
  # the wrong tool here — that class of problem belongs to
  # container_watchdog.py (auto-heal + alert only after a real down/crash-loop),
  # not a healthcheck-triggered restart. Switched from AUTOHEAL_CONTAINER_LABEL=all
  # (which has no exclude mechanism) to label-based: every other healthchecked
  # service is explicitly tagged `autoheal=true`.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    logging: *default-logging
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Backrest - Restic web UI for backup management
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    ports:
      - "${BACKREST_PORT:-9898}:9898"
    volumes:
      - /opt/mother/data/backrest:/data
      - /opt/mother:/backups/mother:ro
      - /opt/mother/data:/backups/data:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mother_network

networks:
  mother_network:
    driver: bridge

volumes:
  tracearr_timescale_data:
  tracearr_redis_data:
