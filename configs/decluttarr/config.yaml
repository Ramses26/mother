general:
  log_level: INFO
  test_run: false # Live 2026-07-19 — new Sonarr message_patterns reviewed via dry-run
                 # (132 items flagged, all genuinely stuck) and the risky
                 # "already imported" pattern was pulled out after verification found a
                 # 3.9% false-positive rate — see comment above.
  timer: 10

job_defaults:
  max_strikes: 3
  min_days_between_searches: 7
  max_concurrent_searches: 3

# Deliberately NOT enabling search_unmet_cutoff / search_missing — Upgraderr already
# owns the "when to trigger a search" decision for this stack (7-tier classification +
# Profile Authority). Decluttarr here is queue/download hygiene only: remove things
# that are permanently stuck so they stop blocking Upgraderr (see the queue-starvation
# fix in services/upgraderr/app.py get_queue_ids()) and stop wasting disk.
jobs:
  remove_stalled:
  remove_failed_downloads:
  remove_failed_imports:
    message_patterns:
      - "Not a Custom Format upgrade for existing*"
      - "Not an upgrade for existing*"
      - "*Found potentially dangerous file with extension*"
      - "Invalid video file*"
      - "No files found are eligible for import*" # matches the qbitmanage orphan-race
                                                    # failures found 2026-07-19 (see
                                                    # Phase 3) — once Phase 3's root-cause
                                                    # fix lands this should stop firing;
                                                    # until then this at least stops the
                                                    # queue entry from blocking forever.
      - "One or more episodes expected in this release were not imported or missing from the release"
      # Added 2026-07-19 — Sonarr-HD's queue had 1194 importBlocked entries, none of
      # which matched the patterns above (those were written for Radarr wording).
      # These are the actual messages found live:
      #
      # Deliberately NOT including "Episode file already imported*" here — verified
      # live against all 723 matching queue rows via the actual episode hasFile flag
      # (not trusting the message text) and found 28 (3.9%) were FALSE: monitored
      # episodes with no file despite the "already imported" message. Pattern-matching
      # can't tell those apart from the other 695 genuine ghosts, so it's handled by a
      # verified one-off cleanup instead (checks hasFile before removing each row) —
      # see the 2026-07-19 session notes / memory for the script. Do not re-add this
      # pattern to decluttarr without a hasFile-aware check.
      - "Episode file on disk contains more episodes than this file contains" # season
                                             # pack / episode-split mismatch — 9,949 of
                                             # these, by far the largest bucket.
      - "Invalid season or episode" # naming parse failure, Sonarr can't identify the
                                     # episode at all — nothing to manually fix here.
      - "Found matching series via grab history, but release was matched to series by ID*"
                                             # genuinely needs Manual Import in the Sonarr
                                             # UI to disambiguate — removing it from the
                                             # queue after 3 strikes stops it blocking
                                             # forever; the underlying release is still on
                                             # disk if it turns out to be needed.
  remove_metadata_missing:
  remove_missing_files:
  remove_orphans:

instances:
  sonarr:
    - base_url: "http://sonarr-hd:8989"
      api_key: !ENV SONARR_HD_API_KEY
    - base_url: "http://sonarr-4k:8989"
      api_key: !ENV SONARR_4K_API_KEY
  radarr:
    - base_url: "http://radarr-hd:7878"
      api_key: !ENV RADARR_HD_API_KEY
    - base_url: "http://radarr-4k:7878"
      api_key: !ENV RADARR_4K_API_KEY

download_clients:
  qbittorrent:
    - base_url: !ENV QBITMANAGE_QBT_HOST
      username: !ENV QBITMANAGE_QBT_USER
      password: !ENV QBITMANAGE_QBT_PASS
