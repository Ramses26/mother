- orgId: 1
  name: infra-plex-backup
  folder: Infra Alerts
  interval: 5m
  rules:
  - uid: plex_backup_failed
    title: Plex backup failed or aborted
    condition: C
    for: 0m
    noDataState: OK
    execErrState: OK
    labels:
      team: infra
    annotations:
      summary: The Plex backup on Nostromo reported a failure or abort in the last 6h ({{ $values.B.Value }}
        occurrences). An ABORT means the pre-flight check refused to run - Plex was NOT stopped, which is the
        safe outcome, but no backup was taken. Check {service="plexbackup"} in Loki and /var/log/plexbackup.log
        on Nostromo. This rule exists because both Apprise instances are non-functional, so the script's own
        notifications do not arrive.
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service="plexbackup"} |~ "ABORT|FAILED|failed integrity check" [6h]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
