  interval: 1m
  rules:
  - uid: qbittorrent_auth_failure
    title: qBittorrent auth failing
    condition: C
    for: 0m
    noDataState: OK
    execErrState: OK
    labels:
      team: infra
    annotations:
      summary: A service failed to authenticate to qBittorrent {{ $values.B.Value }} time(s) in 30m. Torrent
        tagging and any queue-janitor HnR safety check are blind while this persists. Note qBittorrent
        5.x answers a SUCCESSFUL login with HTTP 204 and an EMPTY body - a check expecting the literal
        "Ok." reads every success as a failure (that exact bug ran undetected from 2026-06-17 to 2026-09-01).
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service=~"upgraderr|curatorr|sync-webhook"} |~ "login failed|qBit login
          failed" [30m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        reducer: last
        expression: A
        refId: B
    - refId: C
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
