            - 2
- orgId: 1
  name: infra-hnr-watchdog
  folder: Infra Alerts
  interval: 1m
  rules:
  - uid: hnr_content_removed
    title: Torrent CONTENT deleted (Hit-and-Run risk)
    condition: C
    for: 0m
    noDataState: OK
    execErrState: OK
    labels:
      team: infra
    annotations:
      summary: '{{ $values.B.Value }} torrent(s) had their CONTENT deleted in the last hour. Expected
        ONLY from qbitmanage share-limit cleanup at 120d, or a deliberate purge. Any other source is deleting
        data out from under a seeding torrent, which is exactly what produced 55 TorrentLeech Hit-and-Runs
        via decluttarr on 2026-09-01. Cross-check the qbitmanage log for a matching cleanup before assuming
        it is benign.'
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service="qbittorrent"} |= "Torrent content removed" [1h]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        reducer: last
        expression: A
        refId: B
    - refId: C
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
