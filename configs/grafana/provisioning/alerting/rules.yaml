- orgId: 1
  name: infra-plex-unreachable
  folder: Infra Alerts
  interval: 1m
  rules:
  - uid: plex_unreachable
    title: Plex unreachable (Tautulli/Tracearr)
    condition: C
    for: 0m
    noDataState: OK
    execErrState: OK
    labels:
      team: infra
    annotations:
      summary: Tautulli and/or Tracearr cannot reach Plex on Nostromo ({{ $values.B.Value }} hits/30m).
        Watch history and stream analytics stop being recorded while this lasts - the data is not backfilled.
        Short blips during a Plex restart are normal, which is why this threshold is high; sustained firing
        means Plex or Nostromo needs attention.
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service=~"tautulli|tracearr"} |~ "Connection refused|ECONNREFUSED|timeout
          exceeded" [30m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        reducer: last
        expression: A
        refId: B
    - refId: C
