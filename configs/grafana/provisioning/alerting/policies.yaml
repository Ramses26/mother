apiVersion: 1

# Notification routing. The default receiver is left as grafana-default-email
# (unconfigured / no-op) so we don't hijack global routing. A nested route
# sends anything labeled team=infra to the Mother Notifications Telegram group.
policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: ["grafana_folder", "alertname"]
    routes:
      - receiver: mother-notifications-telegram
        object_matchers:
          - ["team", "=", "infra"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
