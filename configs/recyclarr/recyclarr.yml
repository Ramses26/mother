###############################################################################
# Recyclarr Configuration - Project Mother
# Version: v8 format (recyclarr v8.x)
#
# Profiles:
#   Radarr-HD:  HD Bluray + WEB, Remux + WEB 1080p
#   Radarr-4K:  UHD Bluray + WEB, Remux + WEB 2160p
#   Sonarr-HD:  WEB-1080p, Bluray-1080p, Remux-1080p
#   Sonarr-4K:  WEB-2160p, Bluray-2160p, Remux-2160p
#
# Key customizations:
# - x265 (no HDR/DV) blocking for 1080p (allows HDR x265, blocks SDR x265)
# - Unwanted release blockers
# - Atmos/surround audio bonuses
# - until_quality set to profile maximum (highest quality tier in each profile)
# - until_score: -9999 (prevent Radarr CF-score-chasing autonomous searches)
# - Local CFs: BHDStudio (-50), Bad Container MP4 (-1000) for Radarr only
#
# Last Updated: 2026-06-25
###############################################################################

radarr:
  #---------------------------------------------------------------------------
  # Radarr-HD: 1080p Movies
  # Profiles: HD Bluray + WEB, Remux + WEB 1080p
  #---------------------------------------------------------------------------
  radarr-hd:
    base_url: http://radarr-hd:7878
    api_key: !env_var RADARR_HD_API_KEY

    quality_definition:
      type: movie

    delete_old_custom_formats: true

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: -9999
        quality_sort: top
        qualities:
          # Overrides the stock TRaSH template's allowed list to exclude Bluray-720p.
          # 720p must never be an acceptable end state for this profile — Upgraderr
          # Tier 3's entire job is eliminating 720p; leaving it "allowed" here meant
          # Radarr could legitimately grab and keep a 720p release whenever that's
          # all an indexer search turned up (this is what happened to Mazinger Z).
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

      - trash_id: 9ca12ea80aa55ef916e3751f4b874151  # Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Remux-1080p
          until_score: -9999

    custom_formats:
      # Movie Versions
      - trash_ids:
          - 570bc9ebecd92723d2d21500f4be314c # Remaster
          - eca37840c13c6ef2dd0262b141a5482f # 4K Remaster
          - e0c07d59beb37348e975a930d5e50319 # Criterion Collection
          - 9d27d9d2181838f76dee150882bdc58c # Masters of Cinema
          - db9b4c4b53d312a3ca5f1378f6440fc9 # Vinegar Syndrome
          - 957d0f44b592285f26449575e8b1167e # Special Edition
          - eecf3a857724171f968a66cb5719e152 # IMAX
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de # IMAX Enhanced
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p

      # Unwanted releases
      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p

      # x265 (HD) at score 0 — allows HDR x265 without penalty
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 0
          - name: Remux + WEB 1080p
            score: 0

      # x265 (no HDR/DV) — block SDR x265 at 1080p
      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p

      # DV without HDR fallback + HDR formats
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
          - 493b6d1dbec3c3364c59d7607f7e3405 # HDR Formats
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p

      # Premium audio formats
      - trash_ids:
          - 496f355514737f7d83bf7aa4d24f8169 # TrueHD Atmos
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - 417804f7f2c4308c1f4c5d380d4c4475 # ATMOS (undefined)
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - 1af239278386be2919e1bcee0bde047e # DD+ Atmos
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - 3cafb66171b47f226146a0770576870f # TrueHD
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p
      - trash_ids:
          - a570d4a0e56a2874b64e5bfa55202a1b # FLAC
          - e7c2fcae07cbada050a0af3357491d7b # PCM
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: Remux + WEB 1080p

      # Surround channel bonuses
      - trash_ids:
          - 77ff61788dfe1097194fd8743d7b4524 # 5.1 Surround
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 100
          - name: Remux + WEB 1080p
            score: 100
      - trash_ids:
          - 6fd7b090c3f7317502ab3b63cc7f51e3 # 6.1 Surround
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 150
          - name: Remux + WEB 1080p
            score: 150
      - trash_ids:
          - e77382bcfeba57cb83744c9c5449b401 # 7.1 Surround
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 200
          - name: Remux + WEB 1080p
            score: 200

      # Local custom formats (not in TRaSH Guide)
      - trash_ids:
          - local-bad-container-mp4 # MP4 container: can't hold lossless audio (TrueHD/DTS-HD MA)
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -1000
          - name: Remux + WEB 1080p
            score: -1000
      - trash_ids:
          - local-bhdstudio # BHDStudio: encode group, often MP4, typically lower quality than release groups
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -50
          - name: Remux + WEB 1080p
            score: -50


