<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sync Webhook{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px">
        <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      Sync Webhook
    </div>
    <div class="nav-links">
      <a href="{{ url_for('ui_dashboard') }}"  class="{% if request.path == '/ui' or request.path == '/ui/' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('ui_queue') }}"      class="{% if '/ui/queue' in request.path %}active{% endif %}">Queue</a>
      <a href="{{ url_for('ui_history') }}"    class="{% if '/ui/history' in request.path %}active{% endif %}">History</a>
    </div>
    <span class="nav-hint">internal — no auth</span>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
